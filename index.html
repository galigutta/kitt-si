<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kitt.si — Under Construction</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    background: #0b0d10;
    color: #e8eaed;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .wrap { max-width: 560px; }
  .domain {
    font-size: 13px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #8a919c;
    margin-bottom: 28px;
  }
  h1 {
    font-size: clamp(34px, 7vw, 56px);
    font-weight: 650;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
  }
  p {
    font-size: 16px;
    line-height: 1.6;
    color: #9aa0aa;
    margin-bottom: 36px;
  }
  .bar {
    width: 180px;
    height: 2px;
    background: #23262c;
    border-radius: 2px;
    margin: 0 auto;
    overflow: hidden;
  }
  .bar span {
    display: block;
    height: 100%;
    width: 40%;
    background: #e8eaed;
    border-radius: 2px;
    animation: slide 1.6s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(450%); }
  }
  footer {
    margin-top: 48px;
    font-size: 12px;
    color: #5c626c;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="domain">kitt.si</div>
    <h1>Under construction</h1>
    <p>Something new is being built here.<br>Check back soon.</p>
    <div class="bar"><span></span></div>
    <footer>&copy; 2026</footer>
  </div>
</body>
</html>
